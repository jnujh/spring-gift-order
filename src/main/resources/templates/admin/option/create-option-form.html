<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>옵션 등록</title>
    <meta charset="UTF-8">
</head>
<body>

<h1>옵션 등록</h1>

<form th:action="@{/admin/products/{productId}/options/new(productId=${productId})}" method="post" th:object="${optionRequest}">
    <div>
        <label>옵션 이름:</label>
        <input type="text" th:field="*{name}" />
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div>
        <label>수량:</label>
        <input type="number" th:field="*{quantity}" />
        <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
    </div>

    <div th:if="${errorMessage != null}">
        <p th:text="${errorMessage}" style="color:red;"></p>
    </div>

    <button type="submit">등록</button>
</form>

<a th:href="@{/admin/products}">목록으로</a>

</body>
</html>
