<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: sans-serif;
        }
        .login-container {
            text-align: center;
            padding: 40px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .kakao-login-btn {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .kakao-login-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>선물 주문 서비스</h1>

    <a href="/kakao/login">
        <img src="https://developers.kakao.com/docs/static/image/ko/m/kakaologin.png"
             width="222"
             alt="카카오 로그인 버튼"
             class="kakao-login-btn" />
    </a>
</div>

</body>
</html>
